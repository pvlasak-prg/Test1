<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktuální počasí</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      color: #a8d8ea;
      text-align: center;
    }

    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      text-align: center;
      min-width: 200px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .city {
      font-size: 1.1rem;
      font-weight: 600;
      color: #a8d8ea;
      margin-bottom: 0.5rem;
    }

    .temp {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      margin: 0.5rem 0;
    }

    .feels {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.4rem;
    }

    .weather-desc {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 0.6rem;
    }

    .loading {
      color: rgba(255, 255, 255, 0.5);
      font-style: italic;
    }

    .error {
      color: #ff6b6b;
    }

    .updated {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.5rem 1.4rem;
      border: 1px solid rgba(168, 216, 234, 0.4);
      border-radius: 8px;
      background: rgba(168, 216, 234, 0.1);
      color: #a8d8ea;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    button:hover {
      background: rgba(168, 216, 234, 0.2);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .webcam-section {
      margin-top: 2.5rem;
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .webcam-title {
      font-size: 1rem;
      font-weight: 600;
      color: #a8d8ea;
      margin-bottom: 1rem;
      letter-spacing: 0.04em;
    }

    .webcam-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .webcam-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .webcam-error {
      display: none;
      padding: 2rem;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.9rem;
    }

    .webcam-error a {
      color: #a8d8ea;
      text-decoration: none;
    }

    .webcam-links {
      margin-top: 0.75rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .webcam-links a {
      font-size: 0.78rem;
      color: rgba(168, 216, 234, 0.7);
      text-decoration: none;
      transition: color 0.2s;
    }

    .webcam-links a:hover {
      color: #a8d8ea;
    }

    /* --- Car counter --- */
    .car-section {
      margin-top: 1.25rem;
      width: 100%;
      max-width: 680px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      backdrop-filter: blur(10px);
    }

    .car-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .car-label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .car-count {
      font-size: 1.8rem;
      font-weight: 700;
      color: #a8d8ea;
      min-width: 2.5rem;
      text-align: center;
    }

    .car-count.analyzing {
      font-size: 0.9rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.45);
    }

    .car-meta {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 0.4rem;
      text-align: left;
    }

    .car-error {
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.4);
      border-radius: 8px;
      font-size: 0.8rem;
      color: #ff9999;
      display: none;
    }

    .api-key-row {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-key-row label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      white-space: nowrap;
    }

    .api-key-row input {
      flex: 1;
      min-width: 0;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 0.78rem;
      font-family: monospace;
      outline: none;
    }

    .api-key-row input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .api-key-row input:focus {
      border-color: rgba(168, 216, 234, 0.5);
    }

    #btn-analyze {
      margin-top: 0;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>Aktuální teplota</h1>

  <div class="cards" id="cards">
    <div class="card" id="card-prague">
      <div class="city">Praha</div>
      <div class="temp loading" id="temp-prague">…</div>
      <div class="feels" id="feels-prague"></div>
      <div class="weather-desc" id="desc-prague"></div>
    </div>
    <div class="card" id="card-klimkovice">
      <div class="city">Klimkovice</div>
      <div class="temp loading" id="temp-klimkovice">…</div>
      <div class="feels" id="feels-klimkovice"></div>
      <div class="weather-desc" id="desc-klimkovice"></div>
    </div>
  </div>

  <div class="updated" id="updated"></div>
  <button onclick="fetchAll()">Obnovit</button>

  <div class="webcam-section">
    <div class="webcam-title">Webkamera – Klimkovice, náměstí</div>
    <div class="webcam-frame">
      <img id="webcam-img"
        src="http://www.klimnet.org/webkamera/nam.jpg"
        alt="Webkamera Klimkovice náměstí"
        onerror="this.style.display='none'; document.getElementById('webcam-error').style.display='block';"
      />
      <div class="webcam-error" id="webcam-error">
        Kamera není dostupná –
        <a href="http://www.klimnet.org/webkamera/weblive_nam.html" target="_blank" rel="noopener">otevřít přímo →</a>
      </div>
    </div>
    <div class="webcam-links">
      <a href="http://www.klimnet.org/webkamera/weblive_nam.html" target="_blank" rel="noopener">
        ↗ Náměstí Klimkovice (KlimNet)
      </a>
    </div>
  </div>

  <!-- Car counter -->
  <div class="car-section">
    <div class="car-row">
      <div>
        <div class="car-label">Osobní auta na náměstí</div>
        <div class="car-meta" id="car-meta"></div>
      </div>
      <div class="car-count" id="car-count">–</div>
      <button id="btn-analyze" onclick="analyzeWebcam()">Analyzovat</button>
    </div>
    <div class="api-key-row">
      <label for="api-key-input">Anthropic API klíč:</label>
      <input id="api-key-input" type="password" placeholder="sk-ant-…" autocomplete="off" />
    </div>
    <div class="car-error" id="car-error"></div>
  </div>

  <script>
    const WMO_CODES = {
      0: 'Jasno',
      1: 'Převážně jasno', 2: 'Polojasno', 3: 'Zataženo',
      45: 'Mlha', 48: 'Námraza',
      51: 'Slabé mrholení', 53: 'Mrholení', 55: 'Silné mrholení',
      61: 'Slabý déšť', 63: 'Déšť', 65: 'Silný déšť',
      71: 'Slabé sněžení', 73: 'Sněžení', 75: 'Silné sněžení',
      77: 'Sněhové krupky',
      80: 'Přeháňky', 81: 'Silné přeháňky', 82: 'Velmi silné přeháňky',
      85: 'Sněhové přeháňky', 86: 'Silné sněhové přeháňky',
      95: 'Bouřka', 96: 'Bouřka s krupobitím', 99: 'Bouřka s velkým krupobitím',
    };

    const LOCATIONS = [
      { id: 'prague',     lat: 50.0755, lon: 14.4378 },
      { id: 'klimkovice', lat: 49.7897, lon: 18.1247 },
    ];

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,apparent_temperature,weathercode` +
        `&timezone=Europe%2FPrague`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function fetchAll() {
      document.getElementById('updated').textContent = '';
      for (const loc of LOCATIONS) {
        document.getElementById('temp-' + loc.id).textContent = '…';
        document.getElementById('temp-' + loc.id).className = 'temp loading';
        document.getElementById('feels-' + loc.id).textContent = '';
        document.getElementById('desc-' + loc.id).textContent = '';
      }

      await Promise.all(LOCATIONS.map(async (loc) => {
        try {
          const data = await fetchWeather(loc.lat, loc.lon);
          const cur = data.current;
          const temp = Math.round(cur.temperature_2m);
          const feels = Math.round(cur.apparent_temperature);
          const code = cur.weathercode;

          const tempEl = document.getElementById('temp-' + loc.id);
          tempEl.textContent = temp + ' °C';
          tempEl.className = 'temp';

          document.getElementById('feels-' + loc.id).textContent =
            `Pocitová teplota: ${feels} °C`;

          document.getElementById('desc-' + loc.id).textContent =
            WMO_CODES[code] ?? 'Neznámý stav';
        } catch (e) {
          const tempEl = document.getElementById('temp-' + loc.id);
          tempEl.textContent = 'Chyba';
          tempEl.className = 'temp error';
        }
      }));

      const now = new Date().toLocaleString('cs-CZ');
      document.getElementById('updated').textContent = `Aktualizováno: ${now}`;
    }

    fetchAll();

    setInterval(function () {
      const img = document.getElementById('webcam-img');
      if (img && img.style.display !== 'none') {
        img.src = 'http://www.klimnet.org/webkamera/nam.jpg?t=' + Date.now();
      }
    }, 60000);

    // --- Persist API key in localStorage ---
    const apiKeyInput = document.getElementById('api-key-input');
    apiKeyInput.value = localStorage.getItem('anthropic_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('anthropic_key', apiKeyInput.value.trim());
    });

    async function fetchImageBase64(webcamUrl) {
      const proxies = [
        'https://corsproxy.io/?' + encodeURIComponent(webcamUrl),
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(webcamUrl),
      ];
      let lastErr;
      for (const url of proxies) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload  = () => resolve({ data: reader.result.split(',')[1], type: blob.type || 'image/jpeg' });
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          return base64;
        } catch (e) {
          lastErr = e;
        }
      }
      throw new Error('Snímek z kamery se nepodařilo načíst: ' + lastErr.message);
    }

    async function analyzeWebcam() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert('Zadej Anthropic API klíč.');
        apiKeyInput.focus();
        return;
      }

      const countEl = document.getElementById('car-count');
      const metaEl  = document.getElementById('car-meta');
      const errEl   = document.getElementById('car-error');
      const btn     = document.getElementById('btn-analyze');

      countEl.textContent = 'analyzuji…';
      countEl.className = 'car-count analyzing';
      metaEl.textContent = '';
      errEl.style.display = 'none';
      btn.disabled = true;

      try {
        const webcamUrl = 'http://www.klimnet.org/webkamera/nam.jpg?t=' + Date.now();
        const { data: base64, type: mimeType } = await fetchImageBase64(webcamUrl);

        const apiRes = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-allow-browser': 'true',
            'content-type': 'application/json',
          },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 64,
            messages: [{
              role: 'user',
              content: [
                {
                  type: 'image',
                  source: { type: 'base64', media_type: mimeType, data: base64 },
                },
                {
                  type: 'text',
                  text: 'Kolik osobních automobilů vidíš na tomto snímku z webkamery? Odpověz pouze jedním číslem – bez textu, bez vysvětlení.',
                },
              ],
            }],
          }),
        });

        if (!apiRes.ok) {
          const err = await apiRes.json().catch(() => ({}));
          const msg = err?.error?.message || `HTTP ${apiRes.status}`;
          throw new Error(`Chyba Anthropic API: ${msg}`);
        }

        const data   = await apiRes.json();
        const answer = data.content?.[0]?.text?.trim() ?? '?';

        countEl.textContent = answer;
        countEl.className   = 'car-count';
        metaEl.textContent  = 'Naposledy: ' + new Date().toLocaleTimeString('cs-CZ');
      } catch (e) {
        countEl.textContent = '–';
        countEl.className   = 'car-count';
        errEl.textContent   = e.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
